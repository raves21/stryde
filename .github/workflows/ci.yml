name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stryde
          POSTGRES_PASSWORD: stryde
          POSTGRES_DB: stryde
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stryde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # API integration + two-device convergence tests run against <db>_test / <db>_web_test.
      DATABASE_URL: postgres://stryde:stryde@localhost:5432/stryde
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # keep in sync with packageManager
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: E2E (production build + real API)
        run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
