# Dev database only. Usage: docker compose -f docker/compose.dev.yml up -d
name: stryde-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stryde
      POSTGRES_PASSWORD: stryde
      POSTGRES_DB: stryde
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stryde"]
      interval: 5s
      retries: 10

volumes:
  pgdata-dev: {}
